name: Release

on:
  push:
    branches: [ main ]

jobs:
  release:
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.401'
    
    - name: Restore & Build
      run: |
        $env:MSBuildSDKsPath = 'C:\Program Files\dotnet\sdk\10.0.401\Sdks'
        $env:DOTNET_HOST_PATH = 'C:\Program Files\dotnet\dotnet.exe'
        $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
        dotnet restore src/SqlFluff.Ssms/SqlFluff.Ssms.csproj
        $msb = 'C:\Program Files\Microsoft SQL Server Management Studio 22\Release\MSBuild\Current\Bin\amd64\MSBuild.exe'
        & $msb src/SqlFluff.Ssms/SqlFluff.Ssms.csproj /p:Configuration=Release /v:minimal /nologo
      shell: pwsh
    
    - name: Extract Version
      id: version
      run: |
        $raw = Select-String 'AssemblyVersion\("([^"]+)"\)' src/SqlFluff.Ssms/Properties/AssemblyInfo.cs | % { $_.Matches[0].Groups[1].Value }
        $parts = $raw.Split('.')
        $ver = "$($parts[0]).$($parts[1]).$($parts[2])"
        Write-Output "version=$ver" >> $env:GITHUB_OUTPUT
        Write-Output "Version: $ver (from AssemblyVersion $raw)"
      shell: pwsh

    - name: Check tag doesn't already exist
      id: tagcheck
      run: |
        git fetch --tags
        $exists = (git tag -l "v${{ steps.version.outputs.version }}") -ne ""
        Write-Output "exists=$exists" >> $env:GITHUB_OUTPUT
        if ($exists) {
          Write-Warning "Tag v${{ steps.version.outputs.version }} already exists. Bump the version in AssemblyInfo.cs to publish a new release."
        }
      shell: pwsh

    - name: Extract Release Notes from CHANGELOG
      id: notes
      if: steps.tagcheck.outputs.exists == 'False'
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $lines = Get-Content CHANGELOG.md
        $start = ($lines | Select-String "^## \[$([regex]::Escape($version))\]").LineNumber
        if (-not $start) {
          Write-Warning "No CHANGELOG section found for [$version]; falling back to a generic body."
          Write-Output "notes=" >> $env:GITHUB_OUTPUT
        } else {
          $rest = $lines[$start..($lines.Count - 1)]
          $endOffset = ($rest | Select-Object -Skip 1 | Select-String "^## \[").LineNumber
          $section = if ($endOffset) { $rest[1..($endOffset - 1)] } else { $rest[1..($rest.Count - 1)] }
          $body = ($section -join "`n").Trim()
          $delimiter = "NOTES_EOF_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes<<$delimiter"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter
        }
      shell: pwsh

    - name: Create Release
      if: steps.tagcheck.outputs.exists == 'False'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        body: |
          ${{ steps.notes.outputs.notes }}

          ---

          **Installation**:
          1. Download `SqlFluff.Ssms.vsix` below
          2. Double-click to install, or run: `VSIXInstaller.exe SqlFluff.Ssms.vsix`
          3. Restart SSMS

          **Requirements**:
          - SSMS 22.x
          - Python 3.7+ with SQLFluff: `pip install sqlfluff`

          See the [README](https://github.com/${{ github.repository }}#readme) and [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
        files: src/SqlFluff.Ssms/bin/Release/SqlFluff.Ssms.vsix
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
