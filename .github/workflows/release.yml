name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto = based on labels of the issues closed by PRs merged since the last release)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
      issues: read
      pull-requests: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # The version is never read from (or written back to) AssemblyInfo.cs/vsixmanifest in the
    # repo — main's branch protection blocks direct pushes even from the Actions bot, so a
    # workflow can't commit a version bump back to it without a human-reviewed PR. Instead, the
    # version is computed here from the latest published release tag plus the labels of the
    # issues that PRs merged into main since then actually closed (GitHub's own "Closes #N"
    # link — see docs/WORKFLOW.md), and only ever exists as a git tag / GitHub Release. There is
    # no milestone to assign issues to and nothing to rotate after a release: this is deliberately
    # simpler than that earlier design (see docs/RELEASE.md for why it was dropped).
    - name: Determine version and release notes
      id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $repoFull = "${{ github.repository }}"
        $owner, $name = $repoFull.Split('/', 2)

        git fetch --tags --quiet
        $tagVersions = git tag --list "v*" |
          ForEach-Object { $_.TrimStart('v') } |
          Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
          ForEach-Object { [version]$_ } |
          Sort-Object -Descending
        $current = if ($tagVersions) { $tagVersions[0] } else { [version]"0.0.0" }

        # Everything merged after the previous tag's commit date counts as "in this release".
        # No previous tag (first ever release) means everything on main counts. DateTimeOffset,
        # not DateTime, throughout -- %cI and the GraphQL mergedAt values both carry an explicit
        # UTC offset, and comparing plain [datetime] values mixes Kind=Local (from a runner not
        # in UTC) with Kind=Utc, which .NET compares by raw ticks and silently gets wrong.
        $sinceDate = [datetimeoffset]"1970-01-01T00:00:00Z"
        if ($tagVersions) {
          $prevTag = "v$current"
          $sinceDate = [datetimeoffset](git log -1 --format=%cI $prevTag)
        }

        # Page through every PR merged into main, since GraphQL's PullRequestOrderField has no
        # "merged at" option — a PR's updatedAt can move after it merged (a later comment, a
        # label change), so ordering by it and stopping early would risk missing one. Filtering
        # client-side by mergedAt after fetching everything is the only reliable way.
        $query = @'
        query($owner: String!, $name: String!, $cursor: String) {
          repository(owner: $owner, name: $name) {
            pullRequests(states: MERGED, baseRefName: "main", first: 50, after: $cursor, orderBy: {field: UPDATED_AT, direction: DESC}) {
              pageInfo { hasNextPage endCursor }
              nodes {
                number
                title
                mergedAt
                labels(first: 10) { nodes { name } }
                closingIssuesReferences(first: 10) { nodes { number title labels(first: 10) { nodes { name } } } }
              }
            }
          }
        }
        '@

        $allPrs = @()
        $cursor = $null
        do {
          $ghArgs = @('api', 'graphql', '-f', "query=$query", '-F', "owner=$owner", '-F', "name=$name")
          if ($cursor) { $ghArgs += @('-F', "cursor=$cursor") }
          $resp = (& gh @ghArgs) | ConvertFrom-Json
          $page = $resp.data.repository.pullRequests
          $allPrs += $page.nodes
          $cursor = $page.pageInfo.endCursor
        } while ($page.pageInfo.hasNextPage)

        $mergedSinceLastTag = @($allPrs | Where-Object { [datetimeoffset]$_.mergedAt -gt $sinceDate })

        $isManual = "${{ github.event_name }}" -eq "workflow_dispatch"
        $hasWork = $mergedSinceLastTag.Count -gt 0

        if (-not $hasWork -and -not $isManual) {
          Write-Output "Nothing merged into main since $current; nothing to release."
          Write-Output "hasWork=false" >> $env:GITHUB_OUTPUT
          exit 0
        }

        # One "item" per closed issue (using the issue's own title/labels), or the PR itself when
        # it closes no issue (the chore/CI-only exception — see docs/WORKFLOW.md). Deduplicated
        # by number: an issue reopened and closed again by a second PR in the same window would
        # otherwise show up twice in the notes and get double-counted for the bump-type check.
        # Issue and PR numbers share one sequence per repo, so a plain Number match can't
        # confuse an issue with an unrelated PR.
        $items = foreach ($pr in $mergedSinceLastTag) {
          $closed = @($pr.closingIssuesReferences.nodes)
          if ($closed.Count -gt 0) {
            foreach ($issue in $closed) {
              [pscustomobject]@{ Number = $issue.number; Title = $issue.title; Labels = @($issue.labels.nodes.name) }
            }
          } else {
            [pscustomobject]@{ Number = $pr.number; Title = $pr.title; Labels = @($pr.labels.nodes.name) }
          }
        }
        $items = @($items | Sort-Object Number -Unique)

        # Bump type: an explicit workflow_dispatch input wins; otherwise "enhancement" on any
        # item means minor, anything else (bug/chore/documentation/none) means patch. There's no
        # automatic "major" signal (no "breaking" label convention yet) — force it via the
        # workflow_dispatch input when one is actually needed.
        $bumpInput = "${{ github.event.inputs.bump }}"
        if ([string]::IsNullOrEmpty($bumpInput) -or $bumpInput -eq "auto") {
          $labelNames = @($items | ForEach-Object { $_.Labels })
          $bumpType = if ($labelNames -contains "enhancement") { "minor" } else { "patch" }
        } else {
          $bumpType = $bumpInput
        }

        $newVersion = switch ($bumpType) {
          "major" { [version]::new($current.Major + 1, 0, 0) }
          "minor" { [version]::new($current.Major, $current.Minor + 1, 0) }
          default { [version]::new($current.Major, $current.Minor, $current.Build + 1) }
        }
        $version = "$($newVersion.Major).$($newVersion.Minor).$($newVersion.Build)"

        $tag = "v$version"
        git rev-parse -q --verify "refs/tags/$tag" *> $null
        if ($LASTEXITCODE -eq 0) {
          Write-Warning "Tag $tag already exists; nothing to release."
          Write-Output "hasWork=false" >> $env:GITHUB_OUTPUT
          exit 0
        }

        Write-Output "Current: $current -> New: $version (bump: $bumpType, from $($items.Count) item(s) across $($mergedSinceLastTag.Count) merged PR(s))"

        if ($items.Count -eq 0) {
          $body = "_No linked issues for this release._"
        } else {
          $categories = [ordered]@{
            "### Added"   = @()
            "### Fixed"   = @()
            "### Changed" = @()
            "### Other"   = @()
          }
          foreach ($item in $items) {
            $line = "- $($item.Title) (#$($item.Number))"
            if ($item.Labels -contains "enhancement") { $categories["### Added"] += $line }
            elseif ($item.Labels -contains "bug") { $categories["### Fixed"] += $line }
            elseif ($item.Labels -contains "chore" -or $item.Labels -contains "documentation") { $categories["### Changed"] += $line }
            else { $categories["### Other"] += $line }
          }

          $sections = foreach ($key in $categories.Keys) {
            if ($categories[$key].Count -gt 0) {
              $key
              $categories[$key]
              ""
            }
          }
          $body = ($sections -join "`n").Trim()
        }

        Write-Output "hasWork=true" >> $env:GITHUB_OUTPUT
        Write-Output "version=$version" >> $env:GITHUB_OUTPUT

        $delimiter = "NOTES_EOF_$([guid]::NewGuid().ToString('N'))"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "notes<<$delimiter"
        Add-Content -Path $env:GITHUB_OUTPUT -Value $body
        Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter

        # `git rev-parse --verify` above intentionally exits non-zero in the common case (the tag
        # doesn't exist yet); without this, that stale $LASTEXITCODE would otherwise be inherited
        # as this step's own exit code and mark a successful run as failed.
        exit 0
      shell: pwsh

    # Only patches the checked-out workspace for this build — never committed. Source stays at
    # whatever version it was last manually set to; only tags/Releases carry the real version.
    - name: Apply computed version to the build
      if: steps.version.outputs.hasWork == 'true'
      run: |
        $version = "${{ steps.version.outputs.version }}"

        $asmPath = "src/SqlFluff.Ssms/Properties/AssemblyInfo.cs"
        (Get-Content $asmPath) `
          -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$version.0`")" `
          -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$version.0`")" |
          Set-Content $asmPath

        $manifestPath = "src/SqlFluff.Ssms/source.extension.vsixmanifest"
        $manifest = Get-Content $manifestPath -Raw
        $manifest = $manifest -replace '(<Identity[^>]*\sVersion=")[0-9.]+(")', "`${1}$version`$2"
        Set-Content -Path $manifestPath -Value $manifest -NoNewline
      shell: pwsh

    - name: Setup .NET
      if: steps.version.outputs.hasWork == 'true'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      if: steps.version.outputs.hasWork == 'true'
      uses: microsoft/setup-msbuild@v3

    - name: Restore & Build
      if: steps.version.outputs.hasWork == 'true'
      run: |
        dotnet restore src/SqlFluff.Ssms/SqlFluff.Ssms.csproj
        msbuild src/SqlFluff.Ssms/SqlFluff.Ssms.csproj /p:Configuration=Release /v:minimal /nologo
      shell: pwsh

    - name: Create Release
      if: steps.version.outputs.hasWork == 'true'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        body: |
          ${{ steps.version.outputs.notes }}

          ---

          **Installation**:
          1. Download `SqlFluff.Ssms.vsix` below
          2. Double-click to install, or run: `VSIXInstaller.exe SqlFluff.Ssms.vsix`
          3. Restart SSMS

          **Requirements**:
          - SSMS 22.x
          - Python 3.7+ with SQLFluff: `pip install sqlfluff`

          See the [README](https://github.com/${{ github.repository }}#readme) for usage and configuration, and [all releases](https://github.com/${{ github.repository }}/releases) for the full history.
        files: |
          src/SqlFluff.Ssms/bin/Release/SqlFluff.Ssms.vsix
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
