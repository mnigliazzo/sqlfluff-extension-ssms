name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
      issues: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore & Build
      run: |
        dotnet restore src/SqlFluff.Ssms/SqlFluff.Ssms.csproj
        msbuild src/SqlFluff.Ssms/SqlFluff.Ssms.csproj /p:Configuration=Release /v:minimal /nologo
      shell: pwsh
    
    - name: Extract Version
      id: version
      run: |
        $raw = Select-String 'AssemblyVersion\("([^"]+)"\)' src/SqlFluff.Ssms/Properties/AssemblyInfo.cs | % { $_.Matches[0].Groups[1].Value }
        $parts = $raw.Split('.')
        $ver = "$($parts[0]).$($parts[1]).$($parts[2])"
        Write-Output "version=$ver" >> $env:GITHUB_OUTPUT
        Write-Output "Version: $ver (from AssemblyVersion $raw)"
      shell: pwsh

    - name: Check tag doesn't already exist
      id: tagcheck
      run: |
        git fetch --tags
        $tag = "v${{ steps.version.outputs.version }}"
        git rev-parse -q --verify "refs/tags/$tag" *> $null
        $exists = ($LASTEXITCODE -eq 0)
        Write-Output "exists=$exists" >> $env:GITHUB_OUTPUT
        if ($exists) {
          Write-Warning "Tag $tag already exists. Bump the version in AssemblyInfo.cs to publish a new release."
        } else {
          Write-Output "Tag $tag does not exist yet; will create a release."
        }
        # git rev-parse above intentionally exits non-zero when the tag doesn't exist (the
        # common case) and that would otherwise be inherited as this step's own exit code.
        exit 0
      shell: pwsh

    - name: Extract Release Notes from Milestone Issues
      id: notes
      if: steps.tagcheck.outputs.exists == 'False'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $repo = "${{ github.repository }}"
        $milestoneTitle = "v$version"

        # Release notes are sourced from closed issues in the milestone named "vX.Y.Z" (not from
        # merged PRs), grouped by label the same way CHANGELOG.md's [Keep a Changelog] sections
        # are: enhancement -> Added, bug -> Fixed, chore/documentation -> Changed, anything else
        # -> Other. The milestone is expected to be renamed from "Unreleased" and closed as part
        # of cutting the release (see CONTRIBUTING.md).
        $milestones = gh api "repos/$repo/milestones?state=all" | ConvertFrom-Json
        $milestone = $milestones | Where-Object { $_.title -eq $milestoneTitle } | Select-Object -First 1

        if (-not $milestone) {
          Write-Warning "No milestone named '$milestoneTitle' found; release will have no linked-issues section."
          $body = "_No linked issues for this release._"
        } else {
          $issues = gh api "repos/$repo/issues?milestone=$($milestone.number)&state=closed&per_page=100" | ConvertFrom-Json
          $realIssues = @($issues | Where-Object { -not $_.pull_request })

          if ($realIssues.Count -eq 0) {
            $body = "_No linked issues for this release._"
          } else {
            $categories = [ordered]@{
              "### Added"   = @()
              "### Fixed"   = @()
              "### Changed" = @()
              "### Other"   = @()
            }
            foreach ($issue in $realIssues) {
              $labelNames = @($issue.labels | ForEach-Object { $_.name })
              $line = "- $($issue.title) (#$($issue.number))"
              if ($labelNames -contains "enhancement") { $categories["### Added"] += $line }
              elseif ($labelNames -contains "bug") { $categories["### Fixed"] += $line }
              elseif ($labelNames -contains "chore" -or $labelNames -contains "documentation") { $categories["### Changed"] += $line }
              else { $categories["### Other"] += $line }
            }

            $sections = foreach ($key in $categories.Keys) {
              if ($categories[$key].Count -gt 0) {
                $key
                $categories[$key]
                ""
              }
            }
            $body = ($sections -join "`n").Trim()
          }
        }

        $delimiter = "NOTES_EOF_$([guid]::NewGuid().ToString('N'))"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "notes<<$delimiter"
        Add-Content -Path $env:GITHUB_OUTPUT -Value $body
        Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter
        exit 0
      shell: pwsh

    - name: Create Release
      if: steps.tagcheck.outputs.exists == 'False'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        body: |
          ${{ steps.notes.outputs.notes }}

          ---

          **Installation**:
          1. Download `SqlFluff.Ssms.vsix` below
          2. Double-click to install, or run: `VSIXInstaller.exe SqlFluff.Ssms.vsix`
          3. Restart SSMS

          **Requirements**:
          - SSMS 22.x
          - Python 3.7+ with SQLFluff: `pip install sqlfluff`

          See the [README](https://github.com/${{ github.repository }}#readme) for usage and configuration, and [all releases](https://github.com/${{ github.repository }}/releases) for the full history.
        files: src/SqlFluff.Ssms/bin/Release/SqlFluff.Ssms.vsix
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
